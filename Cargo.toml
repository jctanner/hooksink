[package]
name = "webhook-sink-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Durable webhook sink with cursor and long-poll consumers"
license = "Apache-2.0"

[[bin]]
name = "webhook-sink"
path = "src/main.rs"

[dependencies]
axum = "=0.8.9"
base64 = "=0.22.1"
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "std"] }
form_urlencoded = "=1.2.2"
getrandom = "=0.4.3"
hex = "=0.4.3"
hmac = "=0.12.1"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "=1.52.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }

[dev-dependencies]
http-body-util = "=0.1.3"
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
